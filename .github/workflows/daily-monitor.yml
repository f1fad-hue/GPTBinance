name: Daily source validation and macro refresh
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
concurrency:
  group: daily-source-validation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Scrape and validate authoritative sources, then refresh macro data
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/update_data.py
      - name: Check code and static artifacts
        run: |
          python -m py_compile scripts/update_data.py
          node --check app.js
          python -c "from html.parser import HTMLParser; HTMLParser().feed(open('index.html', encoding='utf-8').read())"
      - name: Commit daily data refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-data.json reports/daily
          git diff --cached --quiet || git commit -m 'chore: refresh validated macro data'
          git push
